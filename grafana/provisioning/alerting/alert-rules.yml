# Copy to /etc/grafana/provisioning/alerting/
# Grafana will auto-import these alert rules on startup.
# Requires: datasource UID matching ${DS_UID} in alert-rules.json
#
# See: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/

apiVersion: 1

groups:
  - orgId: 1
    name: MQ Monitors
    folder: Anypoint MQ Alerts
    interval: 1m
    rules: []  # Populated from grafana/alerts/alert-rules.json
