server:
  port: ${PORT:9101}
  servlet:
    context-path: /

spring:
  application:
    name: anypoint-mq-prometheus-exporter
  main:
    lazy-initialization: false
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.export.datadog.DatadogMetricsExportAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
      # Datadog: activate with SPRING_PROFILES_ACTIVE=datadog (see application-datadog.yml)

anypoint:
  baseUrl: https://anypoint.mulesoft.com
  auth:
    # Option 1: Username/password authentication
    username: ${ANYPOINT_USERNAME:}
    password: ${ANYPOINT_PASSWORD:}
    # Option 2: Connected App authentication (preferred)
    clientId: ${ANYPOINT_CLIENT_ID:}
    clientSecret: ${ANYPOINT_CLIENT_SECRET:}
  organizationId: ${ANYPOINT_ORG_ID:}
  autoDiscovery: ${ANYPOINT_AUTO_DISCOVERY:true}
  environments: []
  regions:
    - us-east-1
  scrape:
    intervalSeconds: ${SCRAPE_INTERVAL_SECONDS:300}
    periodSeconds: 600
    enabled: true
    staleCheckIntervalMs: ${STALE_CHECK_INTERVAL_MS:300000}  # 5 minutes
  http:
    connectTimeoutSeconds: 30
    readTimeoutSeconds: 60
    maxRetries: 3

# Datadog monitor auto-provisioning (optional)
datadog:
  api-key: ${DATADOG_API_KEY:}
  app-key: ${DATADOG_APP_KEY:}
  site: ${DATADOG_SITE:datadoghq.com}
  monitors:
    auto-provision: ${DATADOG_MONITORS_AUTO_PROVISION:false}
    auto-update: ${DATADOG_MONITORS_AUTO_UPDATE:false}
    tag-prefix: ${DATADOG_TAG_PREFIX:source:anypoint-mq-exporter}

logging:
  level:
    com.netflexity.amq.exporter: DEBUG
    org.springframework.web.reactive: INFO
    org.springframework.security: INFO
    io.micrometer: INFO
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'